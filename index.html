<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F6F2" />
    <!-- Applies the saved theme before first paint; a file, not inline, so the CSP can forbid inline scripts. -->
    <script src="/theme-init.js"></script>
    <title>Wera: find jobs that fit you</title>
    <meta name="description" content="Wera watches thousands of companies, scores new jobs against your resume, and shows who sponsors visas and what they pay." />
    <!-- Link previews: crawlers read these without running the app. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wera" />
    <meta property="og:url" content="https://www.wera-jobs.com/" />
    <meta property="og:title" content="Wera: find jobs that fit you" />
    <meta property="og:description" content="Wera watches thousands of companies, scores new jobs against your resume, and shows who sponsors visas and what they pay." />
    <meta property="og:image" content="https://www.wera-jobs.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wera. Find the jobs that fit you. And the ones that sponsor." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Wera" />
  </head>
  <body>
    <div id="root">
      <!-- The first paint on a slow phone; React replaces it. Keep in step with LogoMark. -->
      <div class="boot">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="boot-mark" x1="3" y1="6" x2="21" y2="21" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="var(--color-accent)" />
              <stop offset="1" stop-color="color-mix(in oklab, var(--color-accent) 70%, #ff3d6e)" />
            </linearGradient>
          </defs>
          <path d="M8.75 7V5.25A2.25 2.25 0 0 1 11 3h2a2.25 2.25 0 0 1 2.25 2.25V7" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" />
          <rect x="2" y="6.5" width="20" height="14.5" rx="4" fill="url(#boot-mark)" />
          <path d="M2 12.75h20" stroke="var(--color-bg)" stroke-opacity="0.35" stroke-width="1.25" />
          <rect x="10" y="11" width="4" height="3.5" rx="1.25" fill="var(--color-bg)" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
